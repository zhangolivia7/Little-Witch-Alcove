<!DOCTYPE html>
<html>
  <head>
    <title>Little Witch Alcove</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div id="potion-currency">
        <img src="Assets/Icons/Potion.svg" alt="Potion" class="potion-icon">
        <span id="potion-count">0</span>
    </div>
    <div>
        <img src="Assets/Witch.png" alt="Witch" id="witch-img">
    </div>
    <div id="focus-controls-container">
        <button id="focus-btn">Focus!</button>
        <div id="timer-controls" style="display: none;">
            <span id="timer-text">00:00</span>
            <button id="pause-btn" class="icon-btn">
                <img src="Assets/Icons/Pause.svg" alt="Pause">
            </button>
            <button id="stop-btn" class="icon-btn">
                <img src="Assets/Icons/X.svg" alt="Stop">
            </button>
        </div>
    </div>

    <div id="customization">
        <div class="category-row">
            <img src="Assets/Icons/Hat Category.svg" alt="Hat" class="category-icon">
            <div class="items-scroll">
                <div class="item-slot selected"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
            </div>
        </div>
        <div class="category-row">
            <img src="Assets/Icons/Robe Category.svg" alt="Robe" class="category-icon">
            <div class="items-scroll">
                <div class="item-slot selected"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
                <div class="item-slot"></div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
